<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e40af" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with subtle gradient -->
  <rect width="192" height="192" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Leap trajectory: upward swoosh arc -->
  <path d="M148 120 Q160 80 110 55 Q70 35 55 70" 
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round"/>
  <!-- Motion dots along trajectory -->
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="142" cy="112" r="2.5"/>
    <circle cx="132" cy="95" r="2"/>
    <circle cx="118" cy="78" r="1.5"/>
    <circle cx="100" cy="62" r="2"/>
    <circle cx="80" cy="52" r="1.5"/>
    <circle cx="62" cy="58" r="2"/>
  </g>
  
  <!-- Letter V - bold, modern -->
  <text x="96" y="132" font-size="88" text-anchor="middle" fill="white" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-weight="700" letter-spacing="-2">V</text>
  
  <!-- Subtle highlight on V for depth -->
  <text x="96" y="130" font-size="88" text-anchor="middle" fill="rgba(255,255,255,0.15)" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-weight="700" letter-spacing="-2">V</text>
</svg>