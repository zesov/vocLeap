<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e40af" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with subtle gradient -->
  <rect width="512" height="512" rx="72" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Leap trajectory: upward swoosh arc -->
  <path d="M395 320 Q425 215 290 145 Q185 95 150 190" 
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" stroke-linecap="round"/>
  <!-- Motion dots along trajectory -->
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="378" cy="300" r="6"/>
    <circle cx="350" cy="255" r="5"/>
    <circle cx="315" cy="210" r="4"/>
    <circle cx="270" cy="170" r="5"/>
    <circle cx="215" cy="145" r="4"/>
    <circle cx="170" cy="155" r="5"/>
  </g>
  
  <!-- Letter V - bold, modern -->
  <text x="256" y="352" font-size="230" text-anchor="middle" fill="white" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-weight="700" letter-spacing="-4">V</text>
  
  <!-- Subtle highlight on V for depth -->
  <text x="256" y="348" font-size="230" text-anchor="middle" fill="rgba(255,255,255,0.15)" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-weight="700" letter-spacing="-4">V</text>
</svg>